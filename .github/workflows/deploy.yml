name: Publicar en GitHub Pages

# Push a main: nadie necesita compilar ni subir archivos a mano para
# cambiar el sitio. La página y el widget siguen leyendo el Sheet en vivo
# (RNF-02 no depende de este workflow). El "schedule" de abajo es solo para
# refrescar public/api/v1/*.json (el artefacto estático para consumidores
# externos sin JavaScript) con una frescura razonable entre pushes.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generar public/api/v1 (criterios.json, servicios.json)
        run: bun run build:api
        env:
          VITE_CRITERIOS_CSV_URL: ${{ secrets.VITE_CRITERIOS_CSV_URL }}

      - name: Build de la página principal
        run: bun run build
        env:
          VITE_CRITERIOS_CSV_URL: ${{ secrets.VITE_CRITERIOS_CSV_URL }}
          # Project page (MarteDevs.github.io/observatorio-criterios-tecnicos/).
          # Si el repo se renombra o se pasa a un dominio propio, ajustar o quitar.
          BASE_PATH: /observatorio-criterios-tecnicos/

      - name: Build del widget embebible
        run: bun run build:widget
        env:
          VITE_CRITERIOS_CSV_URL: ${{ secrets.VITE_CRITERIOS_CSV_URL }}

      - name: Unir el widget a la salida de la página
        run: cp dist-widget/widget.js dist/widget.js

      - uses: actions/configure-pages@v5
        with:
          # Habilita Pages solo si todavía no estaba (primera corrida), así
          # el workflow no depende de que alguien haga clic en Settings > Pages antes.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
